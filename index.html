<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindling — A Journal That Follows You</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8A4A2E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  :root {
    --ink:#3A2A1F; --cream:#FBF3E7; --cream2:#F3E4CC;
    --terracotta:#B5651D; --gold:#C68642; --deep:#4A2E1F;
    --sky1:#2E1F1A; --sky2:#8A4A2E; --sky3:#E8B87A;
    --green:#5C8A3A; --blue:#4A6CF7; --red:#B0413E;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#F5EDE0; color:var(--ink); min-height:100vh; }
  button { font-family:inherit; cursor:pointer; border:none; }
  input, textarea, select { font-family:inherit; }
  a { color:var(--terracotta); }

  .center-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .cover-card { width:100%; max-width:440px; }
  .cover-gradient {
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
    border-radius:18px; padding:0; text-align:center; color:#FBF3E7; position:relative; overflow:hidden; height:340px;
  }
  .mountains { position:absolute; bottom:0; left:0; right:0; }
  .cover-content { position:relative; z-index:2; padding:30px 26px 0 26px; }
  .badge { display:inline-block; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.5);
    border-radius:30px; padding:5px 16px; font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
  .cover-title { font-size:36px; font-weight:300; letter-spacing:4px; margin:4px 0; font-family:Georgia,serif; }
  .cover-sub { font-size:13.5px; font-weight:300; margin-bottom:10px; opacity:0.95; }
  .footnote { font-size:10.5px; color:rgba(58,42,31,0.75); text-align:center; margin-top:14px; line-height:1.6; }

  .login-box { background:var(--cream); border-radius:14px; padding:20px; margin-top:16px; box-shadow:0 6px 24px rgba(74,46,31,0.2); }
  .field-label { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--terracotta); font-weight:700; display:block; margin-bottom:6px; }
  .text-input, textarea.text-input, select.text-input {
    width:100%; background:#FFFDF8; border:1.5px solid #E3CFA8; border-radius:8px; padding:10px 12px;
    color:var(--ink); outline:none; margin-bottom:12px; font-size:14px;
  }
  .text-input:focus { border-color:var(--terracotta); }
  .btn-primary { width:100%; background:var(--gold); color:#2b1d14; font-weight:800; border-radius:8px; padding:11px; font-size:14px; }
  .btn-primary:hover { background:#d69852; }
  .btn-primary:disabled { opacity:0.4; cursor:default; }
  .btn-google { width:100%; background:white; color:#3c4043; font-weight:600; border-radius:8px; padding:11px; font-size:14px; border:1.5px solid #dadce0; display:flex; align-items:center; justify-content:center; gap:10px; }
  .btn-google:hover { background:#f7f7f7; }
  .btn-secondary { background:#FFFDF8; color:var(--terracotta); border:1.5px solid var(--terracotta); border-radius:8px; padding:9px 14px; font-size:13px; font-weight:700; }
  .btn-secondary:hover { background:#F3E4CC; }

  .app-shell { max-width:640px; margin:0 auto; padding:0 16px 50px 16px; }
  .app-header { position:sticky; top:0; z-index:10; background:rgba(245,237,224,0.96); backdrop-filter:blur(4px); border-bottom:1px solid #E3CFA8; }
  .app-header-inner { max-width:640px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .brand { font-family:Georgia,serif; font-size:19px; letter-spacing:1px; color:var(--terracotta); }
  .header-right { display:flex; align-items:center; gap:14px; font-size:12px; color:#8a7256; }
  .icon-btn { background:none; color:#8a7256; font-size:15px; padding:2px; }
  .icon-btn:hover { color:var(--terracotta); }
  .tabs { max-width:640px; margin:0 auto; padding:0 16px; display:flex; gap:4px; }
  .tab-btn { background:none; color:#8a7256; padding:8px 14px; border-radius:8px 8px 0 0; font-size:13px; font-weight:600; }
  .tab-btn.active { background:var(--cream); color:var(--terracotta); }
  .tab-btn:hover:not(.active) { color:var(--terracotta); }

  .sync-status { display:flex; align-items:center; gap:8px; font-size:11.5px; padding:8px 12px; border-radius:8px; margin:14px 0; }
  .sync-status.online { background:#EAF2E8; color:var(--green); }
  .sync-status { justify-content:space-between; }
  .sync-retry { background:none; color:var(--terracotta); font-size:11px; font-weight:700; text-decoration:underline; padding:0; }
  .sync-retry:hover { color:var(--deep); }
  .sync-status.offline { background:#FDECEA; color:var(--red); }
  .sync-status.pending { background:#FCF3DD; color:var(--terracotta); }
  .sync-dot { width:8px; height:8px; border-radius:50%; background:currentColor; flex-shrink:0; }

  .quote-card {
    background: linear-gradient(180deg, var(--cream), var(--cream2));
    border:1.5px solid #E3CFA8; border-radius:16px; padding:26px 24px; margin:16px 0;
    box-shadow:0 4px 16px rgba(74,46,31,0.1); position:relative;
  }
  .quote-mark { font-family:Georgia,serif; font-size:44px; color:var(--gold); line-height:0.5; opacity:0.6; }
  .quote-text { font-family:Georgia,serif; font-size:19px; font-style:italic; line-height:1.5; color:var(--deep); margin:10px 0; }
  .quote-meta { font-size:11px; color:#8a7256; text-transform:uppercase; letter-spacing:1px; margin-top:10px; }

  .callout { background:#FCF3DD; border-left:5px solid var(--gold); border-radius:6px; padding:10px 14px; margin:10px 0; font-size:12.5px; line-height:1.5; }
  .callout.terra { background:#FBE9DD; border-left-color:var(--terracotta); }

  .entry-area { width:100%; background:#FFFDF8; border:1.5px solid #E3CFA8; border-radius:8px; padding:12px; color:var(--ink); outline:none; font-size:14px; line-height:1.6; resize:vertical; min-height:140px; }
  .entry-area:focus { border-color:var(--terracotta); }

  .ribbon { background:linear-gradient(100deg, var(--terracotta), #C68642); color:#FBF3E7; font-weight:800; font-size:14px; padding:9px 16px; border-radius:6px; margin:18px 0 10px 0; }

  .entry-card { background:var(--cream); border:1px solid #E3CFA8; border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .entry-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .entry-meta { font-size:11px; color:#8a7256; }
  .entry-quote { font-size:12.5px; font-style:italic; color:var(--terracotta); margin-bottom:8px; font-family:Georgia,serif; }
  .entry-text { font-size:13.5px; line-height:1.6; white-space:pre-wrap; }
  .del-icon { background:#F3E4CC; color:var(--terracotta); font-size:14px; width:30px; height:30px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .del-icon:hover { background:var(--red); color:white; }
  .empty-state { text-align:center; color:#8a7256; font-size:13px; padding:50px 0; }

  .search-wrap { position:relative; margin-bottom:18px; }
  .search-wrap span { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#8a7256; font-size:14px; }
  .search-input { padding-left:32px; }

  .setup-step { display:flex; gap:12px; margin-bottom:14px; }
  .setup-num { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--terracotta); color:white; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .setup-text { font-size:13px; line-height:1.55; padding-top:2px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

/* =========================================================================
   CONFIG PLACEHOLDERS — filled in by the user in Settings, stored locally.
   ========================================================================= */
var GOOGLE_SCOPES = "https://www.googleapis.com/auth/drive.file " +
                     "https://www.googleapis.com/auth/documents " +
                     "https://www.googleapis.com/auth/drive.appdata";
var APPDATA_FILENAME = "kindling-entries.json";

/* =========================================================================
   STORAGE — localStorage is the offline cache/queue; Drive is the source
   of truth once connected and online.
   ========================================================================= */
var memoryFallback = {};
var storageWorks = (function () {
  try { var k = "__kindling_test__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
  catch (e) { return false; }
})();
function storageGet(key) {
  try { if (storageWorks) { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } return memoryFallback[key] || null; }
  catch (e) { return null; }
}
function storageSet(key, value) {
  try { if (storageWorks) localStorage.setItem(key, JSON.stringify(value)); else memoryFallback[key] = value; }
  catch (e) { memoryFallback[key] = value; }
}

/* =========================================================================
   STATE
   ========================================================================= */
var state = {
  screen: "login", profiles: [], profile: null,
  step: "home", // setup | picker | home | journal | addInsight
  clientId: "", apiKey: "",
  connected: false, accessToken: null, tokenExpiry: 0,
  journalDocId: null, journalDocName: "",
  quotes: [], // parsed paragraphs from the connected Google Doc
  entries: [], // {id, date, quote, text, synced}
  pendingSync: [],
  entryText: "", search: "",
  addInsightText: "", saved: false,
  gapiInited: false, gisInited: false,
  shuffledQuote: null, refreshing: false
};

var todayStr = function () { return new Date().toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" }); };
var dayOfYear = function () { var d = new Date(); var start = new Date(d.getFullYear(), 0, 0); var diff = d - start; return Math.floor(diff / 86400000); };
var slug = function (n) { return n.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); };

/* =========================================================================
   ACTIONS — profile / local scaffolding
   ========================================================================= */
function init() {
  state.profiles = storageGet("kindling_profiles") || [];
  render();
}
function enterProfile(name) {
  var clean = (name || "").trim(); if (!clean) return;
  var key = slug(clean);
  if (!state.profiles.some(function (p) { return slug(p) === key; })) {
    state.profiles = state.profiles.concat([clean]); storageSet("kindling_profiles", state.profiles);
  }
  state.profile = clean;
  var saved = storageGet("kindling_config_" + key) || {};
  state.clientId = saved.clientId || ""; state.apiKey = saved.apiKey || "";
  state.journalDocId = saved.journalDocId || null; state.journalDocName = saved.journalDocName || "";
  state.entries = storageGet("kindling_entries_" + key) || [];
  state.pendingSync = storageGet("kindling_pending_" + key) || [];
  state.quotes = storageGet("kindling_quotes_" + key) || [];
  state.connected = !!(state.clientId && state.journalDocId);
  state.screen = "app"; state.step = state.connected ? "home" : "setup";
  render();
}
function logout() { state.profile = null; state.screen = "login"; render(); }
function saveConfig() {
  storageSet("kindling_config_" + slug(state.profile), {
    clientId: state.clientId, apiKey: state.apiKey, journalDocId: state.journalDocId, journalDocName: state.journalDocName
  });
}
function saveEntries() { storageSet("kindling_entries_" + slug(state.profile), state.entries); }
function savePending() { storageSet("kindling_pending_" + slug(state.profile), state.pendingSync); }
function saveQuotes() { storageSet("kindling_quotes_" + slug(state.profile), state.quotes); }

function setTab(t) { state.step = t; render(); }

/* =========================================================================
   GOOGLE SIGN-IN + DRIVE/DOCS SYNC
   All calls are plain REST via fetch with the OAuth access token — no
   backend server involved, everything runs client-side in the browser.
   ========================================================================= */
function saveSetupFields() {
  var cid = document.getElementById("clientIdInput").value.trim();
  var key = document.getElementById("apiKeyInput").value.trim();
  if (!cid) { flash("clientIdInput"); return; }
  state.clientId = cid; state.apiKey = key;
  saveConfig();
  connectGoogle();
}
function flash(id) { var el = document.getElementById(id); if (el) { el.style.borderColor = "#B0413E"; setTimeout(function () { el.style.borderColor = ""; }, 900); } }

function connectGoogle() {
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    alert("Google's sign-in library hasn't finished loading yet — wait a second and try again.");
    return;
  }
  var tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.clientId,
    scope: GOOGLE_SCOPES,
    callback: function (resp) {
      if (resp.error) { alert("Sign-in didn't complete: " + resp.error); return; }
      state.accessToken = resp.access_token;
      state.tokenExpiry = Date.now() + (resp.expires_in || 3500) * 1000;
      openPicker();
    }
  });
  tokenClient.requestAccessToken();
}

function ensureFreshToken(cb) {
  if (state.accessToken && Date.now() < state.tokenExpiry - 30000) { cb(); return; }
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    console.warn("Google sign-in library not available \u2014 staying in local-only mode for now.");
    return;
  }
  var tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.clientId, scope: GOOGLE_SCOPES,
    callback: function (resp) {
      if (resp.error) { console.warn("Token refresh failed:", resp.error); return; }
      state.accessToken = resp.access_token;
      state.tokenExpiry = Date.now() + (resp.expires_in || 3500) * 1000;
      cb();
    }
  });
  tokenClient.requestAccessToken({ prompt: "" });
}

function openPicker() {
  if (!window.gapi) { alert("Google's picker library hasn't finished loading yet — wait a second and try again."); return; }
  gapi.load("picker", function () {
    var picker = new google.picker.PickerBuilder()
      .addView(new google.picker.DocsView(google.picker.ViewId.DOCUMENTS).setMimeTypes("application/vnd.google-apps.document"))
      .setOAuthToken(state.accessToken)
      .setDeveloperKey(state.apiKey)
      .setCallback(function (data) {
        if (data.action === google.picker.Action.PICKED) {
          var doc = data.docs[0];
          state.journalDocId = doc.id;
          state.journalDocName = doc.name;
          saveConfig();
          state.connected = true;
          fetchQuotesFromDoc(function () {
            fetchEntriesFromDrive(function () {
              state.step = "home";
              render();
            });
          });
        }
      })
      .build();
    picker.setVisible(true);
  });
}

function fetchQuotesFromDoc(cb) {
  ensureFreshToken(function () {
    fetch("https://www.googleapis.com/drive/v3/files/" + state.journalDocId + "/export?mimeType=text/plain", {
      headers: { "Authorization": "Bearer " + state.accessToken }
    })
      .then(function (r) { if (!r.ok) throw new Error("Could not read the document (" + r.status + ")"); return r.text(); })
      .then(function (text) {
        var paragraphs = text.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(function (p) { return p.length > 3; });
        state.quotes = paragraphs;
        saveQuotes();
        if (cb) cb();
      })
      .catch(function (err) {
        console.error(err);
        alert("Couldn't pull inspiration from your document just now. Kindling will use whatever was last saved and try again next time you're online.");
        if (cb) cb();
      });
  });
}

function fetchEntriesFromDrive(cb) {
  ensureFreshToken(function () {
    fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27" + APPDATA_FILENAME + "%27&fields=files(id,name)", {
      headers: { "Authorization": "Bearer " + state.accessToken }
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.files && data.files.length > 0) {
          var fileId = data.files[0].id;
          storageSet("kindling_appdata_fileid_" + slug(state.profile), fileId);
          return fetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media", {
            headers: { "Authorization": "Bearer " + state.accessToken }
          }).then(function (r2) { return r2.json(); });
        }
        return null;
      })
      .then(function (remoteEntries) {
        if (remoteEntries && Array.isArray(remoteEntries)) {
          var merged = mergeEntries(state.entries, remoteEntries);
          state.entries = merged;
          saveEntries();
        }
        if (cb) cb();
      })
      .catch(function (err) { console.error(err); if (cb) cb(); });
  });
}

function mergeEntries(local, remote) {
  var byId = {};
  local.forEach(function (e) { byId[e.id] = e; });
  remote.forEach(function (e) { if (!byId[e.id]) byId[e.id] = e; });
  return Object.keys(byId).map(function (k) { return byId[k]; }).sort(function (a, b) { return b.id - a.id; });
}

function syncEntriesToDrive() {
  if (!state.connected || !navigator.onLine) { render(); return; }
  ensureFreshToken(function () {
    var fileId = storageGet("kindling_appdata_fileid_" + slug(state.profile));
    var body = JSON.stringify(state.entries);
    var metadata = { name: APPDATA_FILENAME, parents: fileId ? undefined : ["appDataFolder"] };
    var boundary = "-------kindling" + Date.now();
    var multipartBody =
      "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) + "\r\n" +
      "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + body + "\r\n" +
      "--" + boundary + "--";
    var url = fileId
      ? "https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=multipart"
      : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
    fetch(url, {
      method: fileId ? "PATCH" : "POST",
      headers: { "Authorization": "Bearer " + state.accessToken, "Content-Type": "multipart/related; boundary=" + boundary },
      body: multipartBody
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.id) storageSet("kindling_appdata_fileid_" + slug(state.profile), data.id);
        state.pendingSync = [];
        savePending();
        render();
      })
      .catch(function (err) { console.error(err); render(); });
  });
}

function appendInsightToDoc() {
  var text = document.getElementById("insightArea") ? document.getElementById("insightArea").value.trim() : "";
  if (!text) { flash("insightArea"); return; }
  state.quotes.push(text);
  saveQuotes();
  if (state.connected && navigator.onLine) {
    ensureFreshToken(function () {
      fetch("https://docs.googleapis.com/v1/documents/" + state.journalDocId + ":batchUpdate", {
        method: "POST",
        headers: { "Authorization": "Bearer " + state.accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({
          requests: [{ insertText: { text: "\n\n" + text, endOfSegmentLocation: {} } }]
        })
      })
        .then(function (r) { if (!r.ok) throw new Error("append failed"); return r.json(); })
        .then(function () { state.addInsightText = ""; state.step = "home"; render(); })
        .catch(function (err) {
          console.error(err);
          alert("Saved locally, but couldn't reach your document to save it there too right now. It'll stay queued and sync next time you're online.");
          state.addInsightText = ""; state.step = "home"; render();
        });
    });
  } else {
    alert("Saved locally \u2014 it'll sync to your document next time you're online.");
    state.addInsightText = ""; state.step = "home"; render();
  }
}

/* =========================================================================
   JOURNALING
   ========================================================================= */
function todaysQuote() {
  if (!state.quotes || state.quotes.length === 0) return "Write down one true thing about today.";
  if (state.shuffledQuote !== null && state.shuffledQuote !== undefined) return state.shuffledQuote;
  var idx = dayOfYear() % state.quotes.length;
  return state.quotes[idx];
}

function shuffleSpark() {
  if (!state.quotes || state.quotes.length < 2) { state.shuffledQuote = state.quotes && state.quotes[0]; render(); return; }
  var current = todaysQuote();
  var next = current;
  var tries = 0;
  while (next === current && tries < 10) {
    next = state.quotes[Math.floor(Math.random() * state.quotes.length)];
    tries++;
  }
  state.shuffledQuote = next;
  state.saved = false;
  render();
}

function refreshFromDoc() {
  if (!state.connected) return;
  state.refreshing = true;
  render();
  fetchQuotesFromDoc(function () {
    fetchEntriesFromDrive(function () {
      state.refreshing = false;
      state.shuffledQuote = null;
      render();
    });
  });
}

function saveEntry() {
  var ta = document.getElementById("entryArea");
  var text = ta ? ta.value : state.entryText;
  if (!text.trim()) { flash("entryArea"); return; }
  var entry = { id: Date.now(), date: todayStr(), quote: todaysQuote(), text: text.trim() };
  state.entries = [entry].concat(state.entries);
  saveEntries();
  state.pendingSync.push(entry.id);
  savePending();
  state.saved = true; state.entryText = "";
  render();
  syncEntriesToDrive();
}
function deleteEntry(id) {
  if (!confirm("Delete this journal entry? This can't be undone.")) return;
  state.entries = state.entries.filter(function (e) { return e.id !== id; });
  saveEntries();
  syncEntriesToDrive();
  render();
}

/* =========================================================================
   RENDER
   ========================================================================= */
function mountainSVG() {
  return '<svg class="mountains" width="100%" height="220" viewBox="0 0 440 220" preserveAspectRatio="none">' +
    '<polygon points="0,220 0,140 70,90 140,150 210,70 300,140 360,100 440,150 440,220" fill="#6B3A24" opacity="0.55"/>' +
    '<polygon points="0,220 0,170 90,120 180,175 260,120 340,175 440,130 440,220" fill="#4A2E1F" opacity="0.85"/>' +
  '</svg>';
}

function renderLogin() {
  var chips = state.profiles.map(function (p) {
    return '<button class="btn-secondary" style="margin:3px;" data-action="enterProfileChip" data-name="' + esc(p) + '">&#127755; ' + esc(p) + '</button>';
  }).join("");
  return (
    '<div class="center-screen"><div class="cover-card">' +
      '<div class="cover-gradient">' + mountainSVG() +
        '<div class="cover-content">' +
          '<div class="badge">A Journal That Follows You</div>' +
          '<div class="cover-title">Kindling</div>' +
          '<div class="cover-sub">One quiet spark to write toward, every day.</div>' +
        '</div>' +
      '</div>' +
      '<div class="login-box">' +
        '<label class="field-label">Enter your name to begin or continue</label>' +
        '<input id="nameInput" class="text-input" placeholder="Your name">' +
        '<button class="btn-primary" data-action="handleEnter">Enter &rarr;</button>' +
        (state.profiles.length > 0
          ? '<div style="margin-top:16px; padding-top:14px; border-top:1px solid #E3CFA8;">' +
              '<div style="font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#8a7256; margin-bottom:8px;">Continue as</div>' +
              '<div>' + chips + '</div></div>'
          : '') +
      '</div>' +
    '</div></div>'
  );
}

function renderSetup() {
  return '<div class="ribbon">&#127755; CONNECT YOUR JOURNAL</div>' +
    '<div class="callout terra">Kindling reads inspiration from a Google Doc you choose, and syncs your written entries to your Google Drive so they follow you across every device. This needs a one-time, free setup with Google.</div>' +
    '<div class="setup-step"><div class="setup-num">1</div><div class="setup-text">Go to <a href="https://console.cloud.google.com/apis/credentials" target="_blank">console.cloud.google.com/apis/credentials</a> and create a free project if you don\u2019t have one.</div></div>' +
    '<div class="setup-step"><div class="setup-num">2</div><div class="setup-text">Create an <b>OAuth Client ID</b> (type: Web application) and an <b>API Key</b>. Add the web address you\u2019re hosting Kindling at as an authorized origin.</div></div>' +
    '<div class="setup-step"><div class="setup-num">3</div><div class="setup-text">Enable the <b>Google Drive API</b> and <b>Google Docs API</b> for that project.</div></div>' +
    '<div class="setup-step"><div class="setup-num">4</div><div class="setup-text">Paste both values below, then connect and choose your journal document.</div></div>' +
    '<label class="field-label">OAuth Client ID</label>' +
    '<input id="clientIdInput" class="text-input" placeholder="xxxxxxxxxx.apps.googleusercontent.com" value="' + esc(state.clientId) + '">' +
    '<label class="field-label">API Key</label>' +
    '<input id="apiKeyInput" class="text-input" placeholder="AIza..." value="' + esc(state.apiKey) + '">' +
    '<button class="btn-google" data-action="saveSetupFields">' +
      '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.4 0 5.7 1.5 7 2.7l5.1-5C33 3.9 29 2 24 2 14.8 2 7 7.9 4.3 16l6 4.7C11.6 14.1 17.3 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-2.8-.4-4H24v7.6h12.9c-.3 2.2-1.7 5.4-4.9 7.6l6 4.6c3.6-3.3 5.5-8.2 5.5-15.8z"/><path fill="#FBBC05" d="M10.3 20.7c-.5 1.5-.8 3.1-.8 4.8s.3 3.3.8 4.8l-6 4.7C3 32 2 28.4 2 24.5s1-7.5 2.3-10.5z"/><path fill="#34A853" d="M24 47c5 0 9.5-1.7 12.9-4.6l-6-4.6c-1.7 1.1-3.9 1.8-6.9 1.8-6.7 0-12.4-4.6-14.2-10.7l-6 4.7C7 41.1 14.8 47 24 47z"/></svg>' +
      'Connect Google Drive' +
    '</button>' +
    '<div class="footnote" style="margin-top:14px;">This is your own free Google connection \u2014 Kindling never sees your Google password, and only touches the one document you choose.</div>';
}

function renderHome() {
  var quote = todaysQuote();
  var online = navigator.onLine;
  var retryLink = state.connected ? ' <button class="sync-retry" data-action="refreshFromDoc">' + (state.refreshing ? "Retrying\u2026" : "Retry now") + '</button>' : '';
  var syncHtml = state.connected
    ? (online
        ? (state.pendingSync.length > 0
            ? '<div class="sync-status pending"><span class="sync-dot"></span>Syncing ' + state.pendingSync.length + ' entr' + (state.pendingSync.length === 1 ? "y" : "ies") + ' to Drive&hellip;</div>'
            : '<div class="sync-status online"><span class="sync-dot"></span>Synced to ' + esc(state.journalDocName) + retryLink + '</div>')
        : '<div class="sync-status offline"><span class="sync-dot"></span>Offline \u2014 entries will sync once you\u2019re back online</div>')
    : '<div class="sync-status offline"><span class="sync-dot"></span>Not connected to Google Drive yet</div>';

  return syncHtml +
    '<div class="quote-card">' +
      '<div class="quote-mark">&#8220;</div>' +
      '<div class="quote-text">' + esc(quote) + '</div>' +
      '<div class="quote-meta">' + (state.shuffledQuote ? "A Spark" : "Today\u2019s Spark") + ' &middot; ' + esc(todayStr()) + '</div>' +
    '</div>' +
    '<div style="text-align:center; margin:-8px 0 14px 0;"><button class="btn-secondary" data-action="shuffleSpark">&#128256; New Spark</button></div>' +
    '<label class="field-label">What does this stir up?</label>' +
    '<textarea id="entryArea" class="entry-area" placeholder="A line is enough. So is a page.">' + esc(state.entryText) + '</textarea>' +
    '<button class="btn-primary" style="margin-top:10px;" data-action="saveEntry">' + (state.saved ? "Saved \u2014 write again anytime" : "Save Entry") + '</button>' +
    '<div style="margin-top:10px; text-align:center;"><button class="btn-secondary" data-action="goAddInsight">&#10024; Add a new spark to your journal doc</button></div>';
}

function renderAddInsight() {
  return '<div class="ribbon">&#10024; ADD A NEW SPARK</div>' +
    '<div class="callout">This gets added to the end of your connected Google Doc, so it becomes part of your rotation of daily inspiration \u2014 on every device.</div>' +
    '<textarea id="insightArea" class="entry-area" placeholder="A quote, a line from a book, a thought you had in the shower...">' + esc(state.addInsightText) + '</textarea>' +
    '<button class="btn-primary" style="margin-top:10px;" data-action="appendInsight">Add to My Journal Doc</button>' +
    '<div style="margin-top:10px; text-align:center;"><button class="btn-secondary" data-action="goHome">&larr; Back</button></div>';
}

function renderJournalTab() {
  var filtered = state.entries.filter(function (e) {
    return !state.search.trim() || e.text.toLowerCase().indexOf(state.search.toLowerCase()) !== -1 || e.quote.toLowerCase().indexOf(state.search.toLowerCase()) !== -1;
  });
  var listHtml = filtered.length === 0
    ? '<div class="empty-state">' + (state.entries.length === 0 ? "No entries yet \u2014 write your first one on the Today tab." : "No entries match that search.") + '</div>'
    : filtered.map(function (e) {
        return '<div class="entry-card">' +
          '<div class="entry-card-top"><div class="entry-meta">' + esc(e.date) + '</div>' +
          '<button class="del-icon" data-action="deleteEntry" data-id="' + e.id + '" title="Delete">&#128465;</button></div>' +
          '<div class="entry-quote">' + esc(e.quote) + '</div>' +
          '<div class="entry-text">' + esc(e.text) + '</div>' +
        '</div>';
      }).join("");
  return '<div class="search-wrap"><span>&#128269;</span>' +
    '<input id="searchInput" class="text-input search-input" placeholder="Search your entries..." value="' + esc(state.search) + '"></div>' +
    '<div id="entryList">' + listHtml + '</div>';
}

function renderApp() {
  var body;
  if (state.step === "setup") body = renderSetup();
  else if (state.step === "addInsight") body = renderAddInsight();
  else if (state.step === "journal") body = renderJournalTab();
  else body = renderHome();

  var tabsHtml = state.connected
    ? '<div class="tabs">' +
        '<button class="tab-btn ' + (state.step === "home" || state.step === "addInsight" ? "active" : "") + '" data-action="goHome">&#127755; Today</button>' +
        '<button class="tab-btn ' + (state.step === "journal" ? "active" : "") + '" data-action="goJournal">&#128214; My Journal (' + state.entries.length + ')</button>' +
        '<button class="tab-btn" data-action="goSetup">&#9881; Settings</button>' +
      '</div>'
    : '';

  return '<div class="app-header"><div class="app-header-inner">' +
      '<div class="brand">Kindling</div>' +
      '<div class="header-right"><span>&#127755; ' + esc(state.profile) + '</span>' +
      '<button class="icon-btn" data-action="logout" aria-label="Switch profile">&#10148;</button></div>' +
    '</div>' + tabsHtml + '</div>' +
    '<div class="app-shell" style="padding-top:20px;">' + body + '</div>';
}

function render() {
  var root = document.getElementById("root");
  root.innerHTML = state.screen === "login" ? renderLogin() : renderApp();
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  switch (action) {
    case "handleEnter": { var ni = document.getElementById("nameInput"); enterProfile(ni ? ni.value : ""); break; }
    case "enterProfileChip": enterProfile(el.getAttribute("data-name")); break;
    case "logout": logout(); break;
    case "goHome": setTab("home"); break;
    case "goJournal": setTab("journal"); break;
    case "goSetup": setTab("setup"); break;
    case "goAddInsight": setTab("addInsight"); break;
    case "shuffleSpark": shuffleSpark(); break;
    case "refreshFromDoc": refreshFromDoc(); break;
    case "saveSetupFields": saveSetupFields(); break;
    case "saveEntry": saveEntry(); break;
    case "deleteEntry": deleteEntry(parseInt(el.getAttribute("data-id"), 10)); break;
    case "appendInsight": appendInsightToDoc(); break;
  }
});
document.addEventListener("input", function (e) {
  var id = e.target.id;
  if (id === "entryArea") state.entryText = e.target.value;
  else if (id === "insightArea") state.addInsightText = e.target.value;
  else if (id === "searchInput") { state.search = e.target.value; render(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && state.screen === "login" && document.activeElement && document.activeElement.id === "nameInput") {
    var ni = document.getElementById("nameInput"); enterProfile(ni ? ni.value : "");
  }
});
window.addEventListener("online", function () { if (state.pendingSync.length > 0) syncEntriesToDrive(); else render(); });
window.addEventListener("offline", render);

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  });
}

init();
</script>
</body>
</html>
